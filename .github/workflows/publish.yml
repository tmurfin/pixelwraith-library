name: Publish approved submissions
on: workflow_dispatch
concurrency: library-publish
permissions:
  contents: write
  issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git config user.name "pixelwraith-library" && git config user.email "library@users.noreply.github.com"
      - run: python3 scripts/publish_approved.py
        env:
          GH_TOKEN: ${{ github.token }}
